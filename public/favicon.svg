<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B27AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF2D78;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square for modern look -->
  <rect width="460" height="460" x="26" y="26" rx="90" fill="url(#grad1)" />
  <!-- Stylized cursive 't' to match the brand identity -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-family="'Pacifico', cursive, sans-serif" font-size="340" fill="white">t</text>
  <!-- Subtle 'zw' accent to keep the identity -->
  <text x="440" y="440" text-anchor="end" font-family="'DM Sans', sans-serif" font-weight="700" font-size="48" fill="white" fill-opacity="0.8">ZW</text>
</svg>
